<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    .view-toggle { display:inline-flex; gap:8px; }
    .toggle-btn {
      border:1px solid rgba(201,204,210,.2);
      background:rgba(15,22,34,.35);
      padding:9px 12px;
      border-radius:10px;
      font-size:13px;
      cursor:pointer;
    }
    .toggle-btn[aria-pressed="true"] {
      border-color:rgba(182,230,0,.4);
      background:rgba(182,230,0,.12);
    }
    #clubsMap {
      width:100%;
      height:420px;
      border-radius:14px;
      border:1px solid rgba(201,204,210,.18);
    }
    @media(max-width:640px){ #clubsMap{height:360px;} }
  </style>
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>
      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width: 860px;">
    <h1 class="brand">
      <span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span>
    </h1>

    <p style="max-width: 820px; margin: 0 auto; font-size: 15px; line-height: 1.75; opacity: .9;">
      Compare <strong>published price ranges</strong> for padel clubs across the UK.
      Each card includes a booking link and a source link.
    </p>

    <!-- Filters (UNCHANGED) -->
    <section style="margin-top: 18px; text-align:left;">
      <div style="font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px;">
        Search & filter
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="searchInput" type="text" placeholder="Search venue…" style="flex:1; min-width: 220px;" />
        <select id="regionFilter" style="min-width:220px;"><option value="">All regions</option></select>
        <select id="countyFilter" style="min-width:240px;"><option value="">All counties / city-regions</option></select>
        <select id="cityFilter" style="min-width:220px;"><option value="">All cities</option></select>
        <select id="areaFilter" style="min-width:220px;"><option value="">All areas</option></select>
      </div>

      <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:10px;">
          <label style="font-size:13px;">
            <input type="checkbox" id="rememberToggle" /> Remember my default location
          </label>
          <span id="savedLabel" style="font-size:13px; opacity:.8;"></span>
          <button id="clearDefaultBtn" hidden>Clear default</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
          <div id="resultCount" style="font-size:13px; opacity:.8;"></div>
          <div class="view-toggle">
            <button id="listViewBtn" class="toggle-btn" aria-pressed="true">List</button>
            <button id="mapViewBtn" class="toggle-btn" aria-pressed="false">Map</button>
          </div>
        </div>
      </div>

      <div style="margin-top:10px; display:flex; justify-content:flex-end;">
        <button id="resetBtn">Reset filters</button>
      </div>

      <div style="height:1px; background: rgba(201,204,210,.14); margin:16px 0;"></div>
    </section>

    <section id="mapView" hidden>
      <div id="clubsMap"></div>
    </section>

    <section id="cardsSection" style="margin-top:16px;">
      <div id="cards" style="display:grid; gap:12px;"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const PRICING_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScd-zwQsGJvYPwU4f_Avfy5xUhaSrSAZFrO4iVWLbHipkhRym1iRBOcnLqRqCeCQrcP6BTABkPEqxf/pub?single=true&gid=0&output=csv";

    const VIEW_KEY = "unipadel_clubs_view_v1";

    const els = {
      cards: document.getElementById("cards"),
      cardsSection: document.getElementById("cardsSection"),
      search: document.getElementById("searchInput"),
      region: document.getElementById("regionFilter"),
      county: document.getElementById("countyFilter"),
      city: document.getElementById("cityFilter"),
      area: document.getElementById("areaFilter"),
      reset: document.getElementById("resetBtn"),
      count: document.getElementById("resultCount"),
      listBtn: document.getElementById("listViewBtn"),
      mapBtn: document.getElementById("mapViewBtn"),
      mapView: document.getElementById("mapView"),
      mapEl: document.getElementById("clubsMap"),
    };

    let map, cluster, lastFiltered = [];

    function setView(mode) {
      const isMap = mode === "map";
      localStorage.setItem(VIEW_KEY, mode);
      els.mapView.hidden = !isMap;
      els.cardsSection.hidden = isMap;
      els.listBtn.setAttribute("aria-pressed", !isMap);
      els.mapBtn.setAttribute("aria-pressed", isMap);
      if (isMap) {
        if (!map) initMap();
        setTimeout(() => {
          map.invalidateSize();
          updateMap(lastFiltered, true);
        }, 50);
      }
    }

    function initMap() {
      map = L.map(els.mapEl).setView([54.5, -3], 6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
      cluster = L.markerClusterGroup({ disableClusteringAtZoom: 15 });
      map.addLayer(cluster);
    }

    function updateMap(rows, fit) {
      if (!cluster) return;
      cluster.clearLayers();
      const pts = [];
      rows.forEach(r => {
        if (!isFinite(r.Latitude) || !isFinite(r.Longitude)) return;
        cluster.addLayer(L.marker([r.Latitude, r.Longitude]).bindPopup(r.Venue));
        pts.push([r.Latitude, r.Longitude]);
      });
      if (fit && pts.length) map.fitBounds(pts, { padding: [30,30] });
    }

    function applyFilters(rows) {
      const q = els.search.value.toLowerCase();
      const region = els.region.value;
      const county = els.county.value;
      const city = els.city.value;
      const area = els.area.value;

      const filtered = rows.filter(r =>
        (!region || r.Region === region) &&
        (!county || r.County === county) &&
        (!city || r.City === city) &&
        (!area || r.Area === area) &&
        (!q || `${r.Venue} ${r.City} ${r.Area}`.toLowerCase().includes(q))
      );

      els.count.textContent = `${filtered.length} clubs shown`;
      renderCards(filtered);

      const isMapView = !els.mapView.hidden;
      if (map) updateMap(filtered, isMapView);

      lastFiltered = filtered;
    }

    function renderCards(rows) {
      els.cards.innerHTML = rows.map(r => `
        <div style="padding:14px;border-radius:14px;border:1px solid rgba(201,204,210,.18);background:rgba(15,22,34,.35);">
          <strong>${r.Venue}</strong><br/>
          ${r.Area} · ${r.City}<br/>
          <strong>${r.PriceRange}</strong> ${r.PriceUnit}
        </div>
      `).join("");
    }

    async function init() {
      const res = await fetch(PRICING_CSV_URL);
      const csv = await res.text();
      const lines = csv.split("\n").slice(1);
      const rows = lines.map(l => {
        const c = l.split(",");
        return {
          Venue: c[0],
          City: c[1],
          Area: c[2],
          PriceRange: c[5],
          PriceUnit: c[6],
          Latitude: parseFloat(c[10]),
          Longitude: parseFloat(c[11]),
        };
      });

      applyFilters(rows);

      els.search.oninput = () => applyFilters(rows);
      els.region.onchange = () => applyFilters(rows);
      els.county.onchange = () => applyFilters(rows);
      els.city.onchange = () => applyFilters(rows);
      els.area.onchange = () => applyFilters(rows);
      els.reset.onclick = () => { els.search.value = ""; els.region.value = ""; els.county.value = ""; els.city.value = ""; els.area.value = ""; applyFilters(rows); };

      els.listBtn.onclick = () => setView("list");
      els.mapBtn.onclick = () => setView("map");

      setView(localStorage.getItem(VIEW_KEY) || "list");
    }

    init();
  </script>
</body>
</html>
