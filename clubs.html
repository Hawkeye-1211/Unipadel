<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>

      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width: 860px;">
    <h1 class="brand">
      <span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span>
    </h1>

    <p style="max-width: 820px; margin: 0 auto; font-size: 15px; line-height: 1.75; opacity: .9;">
      Compare <strong>published price ranges</strong> for padel clubs across the UK.
      Each card includes a booking link and a source link.
    </p>

    <!-- Controls -->
    <section style="margin-top: 18px; text-align:left;">
      <div style="font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px;">
        Search & filter
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input
          id="searchInput"
          type="text"
          placeholder="Search venue / area / city…"
          style="flex:1; min-width: 220px;"
        />

        <!-- ✅ Grouped dropdown -->
        <select id="locationFilter" style="width:auto; min-width: 320px;">
          <option value="">All locations</option>
        </select>
      </div>

      <!-- ✅ Explicit default controls -->
      <div style="margin-top: 10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:10px; font-size:13px; opacity:.9;">
            <input type="checkbox" id="rememberLocToggle" />
            Remember my default location
          </label>

          <span id="savedLocLabel" style="font-size:13px; opacity:.8;"></span>

          <button id="clearDefaultBtn" type="button" style="padding:8px 10px; font-size:13px;" hidden>
            Clear default
          </button>
        </div>

        <div id="resultCount" style="font-size: 13px; opacity: .8;"></div>
      </div>

      <div style="margin-top:10px; display:flex; justify-content:flex-end;">
        <button id="resetBtn" type="button" style="padding:10px 12px; font-size:14px;">
          Reset filters
        </button>
      </div>

      <div style="height:1px; background: rgba(201,204,210,.14); margin: 16px 0;"></div>
    </section>

    <!-- Status -->
    <section style="text-align:left;">
      <div
        id="dataStatus"
        style="
          padding: 12px 14px;
          border-radius: 12px;
          background: rgba(15,22,34,.35);
          border: 1px solid rgba(201,204,210,.18);
          font-size: 13px;
          line-height: 1.6;
          opacity: .9;
        "
      >
        Loading clubs…
      </div>
    </section>

    <!-- Cards -->
    <section style="margin-top: 16px;">
      <div id="cards" style="display:grid; grid-template-columns: 1fr; gap: 12px;"></div>
    </section>

    <section style="margin-top: 18px; text-align:center;">
      <p style="font-size: 14px; opacity: .8; margin: 0;">
        Found something wrong or missing? <a href="/ideas.html">Share a suggestion</a>.
      </p>
    </section>
  </div>

  <script>
    // ----------------------------
    // Admin navbar handling
    // ----------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const ADMIN_SESSION_KEY = "Unipadel_admin_session";
      const isAdminMode = sessionStorage.getItem(ADMIN_SESSION_KEY) === "true";

      const adminNavLink = document.getElementById("adminNavLink");
      const exitAdminLink = document.getElementById("exitAdminLink");

      if (adminNavLink) adminNavLink.hidden = !isAdminMode;
      if (exitAdminLink) exitAdminLink.hidden = !isAdminMode;

      if (exitAdminLink) {
        exitAdminLink.addEventListener("click", (e) => {
          e.preventDefault();
          sessionStorage.removeItem(ADMIN_SESSION_KEY);
          window.location.href = "/ideas.html";
        });
      }
    });

    // ----------------------------
    // LIVE CSV export (published)
    // ----------------------------
    const PRICING_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScd-zwQsGJvYPwU4f_Avfy5xUhaSrSAZFrO4iVWLbHipkhRym1iRBOcnLqRqCeCQrcP6BTABkPEqxf/pub?single=true&gid=0&output=csv";

    // ----------------------------
    // Default location (explicit toggle)
    // ----------------------------
    const DEFAULT_LOC_KEY = "unipadel_default_location";   // stores the locationFilter value
    const REMEMBER_LOC_KEY = "unipadel_remember_location"; // "1" or "0"

    const els = {
      cards: document.getElementById("cards"),
      status: document.getElementById("dataStatus"),
      search: document.getElementById("searchInput"),
      location: document.getElementById("locationFilter"),
      reset: document.getElementById("resetBtn"),
      count: document.getElementById("resultCount"),

      rememberToggle: document.getElementById("rememberLocToggle"),
      savedLabel: document.getElementById("savedLocLabel"),
      clearDefaultBtn: document.getElementById("clearDefaultBtn"),
    };

    function norm(s) { return String(s || "").trim(); }

    function safeLink(url) {
      const u = norm(url);
      if (!u) return "";
      if (u.startsWith("http://") || u.startsWith("https://")) return u;
      return "";
    }

    function keyify(header) {
      return norm(header).toLowerCase().replace(/\s+/g, "").replace(/[^a-z0-9]/g, "");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function parseCsvToRows(csvText) {
      const text = csvText.replace(/^\uFEFF/, "");
      const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
      if (!lines.length) return [];

      function splitCsvLine(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (ch === "," && !inQuotes) {
            out.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      const rawHeaders = splitCsvLine(lines[0]);
      const headers = rawHeaders.map(h => keyify(h));

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = splitCsvLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => obj[h] = cols[idx] ?? "");
        rows.push(obj);
      }
      return rows;
    }

    function mapRow(r) {
      const get = (k) => norm(r[k] || "");
      return {
        Venue: get("venue"),
        City: get("city"),
        Area: get("area"),
        BookingPlatform: get("bookingplatform"),
        BookingURL: get("bookingurl"),
        PriceRange: get("pricerange"),
        PriceUnit: get("priceunit"),
        SourceURL: get("sourceurl"),
        Active: get("active"), // optional
      };
    }

    function isRowActive(r) {
      const activeRaw = norm(r.Active).toLowerCase();
      const hasActiveCol = activeRaw !== "";
      return !hasActiveCol || ["true", "1", "yes", "y"].includes(activeRaw);
    }

    // ----------------------------
    // Group rules (edit anytime)
    // ----------------------------
    function groupForCity(city) {
      const c = norm(city);

      // Greater London roll-up (your sheet uses London + nearby towns)
      const greaterLondon = new Set(["London","Romford","Ilford","Barnet","Watford","Weybridge"]);
      if (greaterLondon.has(c)) return "Greater London";

      // Greater Manchester roll-up
      const greaterManchester = new Set(["Manchester","Stockport","Cheadle"]);
      if (greaterManchester.has(c)) return "Greater Manchester";

      // West Yorkshire roll-up (adjust as you add)
      const westYorks = new Set(["Leeds","Wetherby"]);
      if (westYorks.has(c)) return "Leeds / West Yorkshire";

      // Merseyside / Liverpool area
      const merseyside = new Set(["Liverpool","Birkenhead","Bromborough","Ellesmere Port"]);
      if (merseyside.has(c)) return "Liverpool / Merseyside";

      // North East
      const northEast = new Set(["Newcastle upon Tyne","Sunderland","Northumberland","Morpeth","Blaydon"]);
      if (northEast.has(c)) return "Newcastle / North East";

      // Fallback: group by the city itself
      return c || "Other";
    }

    function locationValue(groupLabel, city, area) {
      // Encode in one value: group|city|area (safe)
      return `${groupLabel}||${norm(city)}||${norm(area)}`;
    }

    function parseLocationValue(val) {
      const parts = String(val || "").split("||");
      if (parts.length !== 3) return { group: "", city: "", area: "" };
      return { group: parts[0], city: parts[1], area: parts[2] };
    }

    function setSavedLocUI() {
      const rememberOn = localStorage.getItem(REMEMBER_LOC_KEY) === "1";
      const savedVal = norm(localStorage.getItem(DEFAULT_LOC_KEY));

      els.rememberToggle.checked = rememberOn;

      if (rememberOn && savedVal) {
        const p = parseLocationValue(savedVal);
        const label = p.area ? `${p.group} · ${p.area}` : p.group;
        els.savedLabel.textContent = `Default: ${label}`;
        els.clearDefaultBtn.hidden = false;
      } else if (rememberOn) {
        els.savedLabel.textContent = "Default: (not set yet)";
        els.clearDefaultBtn.hidden = true;
      } else {
        els.savedLabel.textContent = "Default: off";
        els.clearDefaultBtn.hidden = true;
      }
    }

    function buildGroupedLocations(rows) {
      // Build structure: group -> areas (unique), plus we keep city inside value for correct filtering
      const groups = new Map(); // group -> Map(areaLower -> {area, cityAny, group})
      for (const r of rows) {
        if (!isRowActive(r)) continue;

        const city = norm(r.City);
        const area = norm(r.Area);
        const group = groupForCity(city);

        if (!groups.has(group)) groups.set(group, new Map());
        const areaKey = area.toLowerCase();

        // If multiple cities share an "area" string, keep the first; city is still stored in value
        if (!groups.get(group).has(areaKey)) {
          groups.get(group).set(areaKey, { group, city, area });
        }
      }

      // Sort groups and areas
      const groupNames = [...groups.keys()].sort((a,b) => a.localeCompare(b));
      return { groups, groupNames };
    }

    function fillLocationDropdown(rows) {
      const { groups, groupNames } = buildGroupedLocations(rows);

      let html = `<option value="">All locations</option>`;

      for (const g of groupNames) {
        const areasMap = groups.get(g);
        const areas = [...areasMap.values()].sort((a,b) => a.area.localeCompare(b.area));

        html += `<optgroup label="${escapeHtml(g)}">`;
        for (const item of areas) {
          const v = locationValue(item.group, item.city, item.area);
          html += `<option value="${escapeHtml(v)}">${escapeHtml(item.area)}</option>`;
        }
        html += `</optgroup>`;
      }

      els.location.innerHTML = html;
      return new Set([...els.location.options].map(o => o.value));
    }

    function renderCards(rows) {
      els.cards.innerHTML = "";

      if (!rows.length) {
        els.cards.innerHTML = `
          <div style="padding:16px;border-radius:14px;border:1px dashed rgba(201,204,210,.25);text-align:center;opacity:.9;">
            No clubs match your filters.
          </div>
        `;
        return;
      }

      for (const r of rows) {
        const venue = norm(r.Venue);
        const city = norm(r.City);
        const area = norm(r.Area);
        const platform = norm(r.BookingPlatform);
        const bookingUrl = safeLink(r.BookingURL);
        const sourceUrl = safeLink(r.SourceURL);
        const priceRange = norm(r.PriceRange);
        const priceUnit = norm(r.PriceUnit);

        const card = document.createElement("div");
        card.style.padding = "14px";
        card.style.borderRadius = "14px";
        card.style.border = "1px solid rgba(201,204,210,.18)";
        card.style.background = "rgba(15,22,34,.35)";
        card.style.textAlign = "left";

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">
            <div style="min-width: 240px; flex: 1;">
              <div style="font-weight:700; font-size:16px; line-height:1.35;">${escapeHtml(venue || "Unnamed venue")}</div>
              <div style="margin-top:6px; font-size:13px; opacity:.85;">
                ${escapeHtml([area, city].filter(Boolean).join(" · "))}
              </div>
              <div style="margin-top:6px; font-size:12px; opacity:.75;">
                Booking: ${escapeHtml(platform || "—")}
              </div>
            </div>

            <div style="min-width: 180px; text-align:right;">
              <div style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.65;">Published range</div>
              <div style="margin-top:6px; font-size:20px; font-weight:700; line-height:1.2;">
                ${escapeHtml(priceRange || "—")}
              </div>
              <div style="margin-top:4px; font-size:12px; opacity:.8;">
                ${escapeHtml(priceUnit || "")}
              </div>
            </div>
          </div>

          <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            ${
              bookingUrl
                ? `<a href="${escapeHtml(bookingUrl)}" target="_blank" rel="noopener noreferrer"
                     style="display:inline-block; padding:10px 12px; border-radius:10px; text-decoration:none;
                            background: rgba(182,230,0,.14); border: 1px solid rgba(182,230,0,.30);">
                     Book
                   </a>`
                : ""
            }

            ${
              sourceUrl
                ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer"
                     style="display:inline-block; padding:10px 12px; border-radius:10px; text-decoration:none;
                            background: rgba(47,128,237,.12); border: 1px solid rgba(47,128,237,.30);">
                     Source
                   </a>`
                : ""
            }
          </div>
        `;

        els.cards.appendChild(card);
      }
    }

    function applyFilters(allRows) {
      const q = norm(els.search.value).toLowerCase();
      const loc = norm(els.location.value);

      let locCity = "";
      let locArea = "";
      if (loc) {
        const p = parseLocationValue(loc);
        locCity = norm(p.city);
        locArea = norm(p.area);
      }

      const filtered = allRows.filter((r) => {
        if (!isRowActive(r)) return false;

        const hay = `${norm(r.Venue)} ${norm(r.City)} ${norm(r.Area)} ${norm(r.BookingPlatform)} ${norm(r.PriceRange)}`
          .toLowerCase();

        if (q && !hay.includes(q)) return false;
        if (locCity && norm(r.City) !== locCity) return false;
        if (locArea && norm(r.Area) !== locArea) return false;
        return true;
      });

      els.count.textContent = `${filtered.length} club${filtered.length === 1 ? "" : "s"} shown`;
      renderCards(filtered);
    }

    async function loadData() {
      try {
        els.status.textContent = "Loading clubs…";
        const res = await fetch(PRICING_CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("CSV HTTP " + res.status);

        const csv = await res.text();
        const rawRows = await parseCsvToRows(csv);
        const mapped = rawRows.map(mapRow);

        const cleaned = mapped.filter(r =>
          norm(r.Venue) &&
          norm(r.City) &&
          norm(r.Area) &&
          norm(r.BookingPlatform) &&
          safeLink(r.BookingURL) &&
          norm(r.PriceRange) &&
          norm(r.PriceUnit) &&
          safeLink(r.SourceURL)
        );

        if (!cleaned.length) {
          els.status.innerHTML =
            `No rows matched the expected headers/fields.<br/>
             Make sure your header row includes:<br/>
             <code>Venue, City, Area, BookingPlatform, BookingURL, PriceRange, PriceUnit, SourceURL</code>`;
          return [];
        }

        els.status.textContent = "Showing published price ranges — tap “Source” to verify.";
        return cleaned;
      } catch (err) {
        console.error(err);
        els.status.innerHTML =
          `Could not load clubs right now.<br/>
           <span style="opacity:.85;">Reason: ${escapeHtml(String(err.message || err))}</span>`;
        return [];
      }
    }

    (async function init() {
      const rows = await loadData();

      if (!localStorage.getItem(REMEMBER_LOC_KEY)) localStorage.setItem(REMEMBER_LOC_KEY, "0");
      setSavedLocUI();

      const validValues = fillLocationDropdown(rows);

      // Apply saved default location if remember is on
      const rememberOn = localStorage.getItem(REMEMBER_LOC_KEY) === "1";
      const savedVal = norm(localStorage.getItem(DEFAULT_LOC_KEY));
      if (rememberOn && savedVal && validValues.has(savedVal)) {
        els.location.value = savedVal;
      } else if (savedVal && !validValues.has(savedVal)) {
        localStorage.removeItem(DEFAULT_LOC_KEY);
      }

      applyFilters(rows);

      els.search.addEventListener("input", () => applyFilters(rows));

      els.location.addEventListener("change", () => {
        if (localStorage.getItem(REMEMBER_LOC_KEY) === "1") {
          const chosen = norm(els.location.value);
          if (chosen) localStorage.setItem(DEFAULT_LOC_KEY, chosen);
          else localStorage.removeItem(DEFAULT_LOC_KEY);
          setSavedLocUI();
        }
        applyFilters(rows);
      });

      els.rememberToggle.addEventListener("change", () => {
        localStorage.setItem(REMEMBER_LOC_KEY, els.rememberToggle.checked ? "1" : "0");
        if (!els.rememberToggle.checked) {
          localStorage.removeItem(DEFAULT_LOC_KEY);
        } else {
          const chosen = norm(els.location.value);
          if (chosen) localStorage.setItem(DEFAULT_LOC_KEY, chosen);
        }
        setSavedLocUI();
      });

      els.clearDefaultBtn.addEventListener("click", () => {
        localStorage.removeItem(DEFAULT_LOC_KEY);
        els.location.value = "";
        setSavedLocUI();
        applyFilters(rows);
      });

      els.reset.addEventListener("click", () => {
        els.search.value = "";
        els.location.value = "";
        if (localStorage.getItem(REMEMBER_LOC_KEY) === "1") {
          localStorage.removeItem(DEFAULT_LOC_KEY);
        }
        setSavedLocUI();
        applyFilters(rows);
      });
    })();
  </script>
</body>
</html>
