<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <!-- Leaflet (lightweight map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Leaflet MarkerCluster (for dense areas like London) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <style>
    /* Clubs Map View (kept local to this page to avoid touching style.css) */
    .view-toggle {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toggle-btn {
      appearance: none;
      border: 1px solid rgba(201,204,210,.20);
      background: rgba(15,22,34,.35);
      color: inherit;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
    }
    .toggle-btn[aria-pressed="true"] {
      border-color: rgba(182,230,0,.35);
      background: rgba(182,230,0,.10);
    }
    #mapView {
      margin-top: 12px;
    }
    #clubsMap {
      width: 100%;
      height: 420px;
      border-radius: 14px;
      border: 1px solid rgba(201,204,210,.18);
      background: rgba(15,22,34,.35);
      overflow: hidden;
    }
    @media (max-width: 640px) {
      #clubsMap { height: 360px; }
    }
    #mapHint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .85;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15,22,34,.35);
      border: 1px solid rgba(201,204,210,.18);
      line-height: 1.6;
    }
  </style>
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>

      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width: 860px;">
    <h1 class="brand">
      <span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span>
    </h1>

    <p style="max-width: 820px; margin: 0 auto; font-size: 15px; line-height: 1.75; opacity: .9;">
      Compare <strong>published price ranges</strong> for padel clubs across the UK.
      Each card includes a booking link and a source link.
    </p>

    <section style="margin-top: 18px; text-align:left;">
      <div style="font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px;">
        Search & filter
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="searchInput" type="text" placeholder="Search venue…" style="flex:1; min-width: 220px;" />

        <select id="regionFilter" style="width:auto; min-width: 220px;">
          <option value="">All regions</option>
        </select>

        <select id="countyFilter" style="width:auto; min-width: 240px;">
          <option value="">All counties / city-regions</option>
        </select>

        <select id="cityFilter" style="width:auto; min-width: 220px;">
          <option value="">All cities</option>
        </select>

        <select id="areaFilter" style="width:auto; min-width: 220px;">
          <option value="">All areas</option>
        </select>
      </div>

      <div style="margin-top: 10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:10px; font-size:13px; opacity:.9;">
            <input type="checkbox" id="rememberToggle" />
            Remember my default location
          </label>

          <span id="savedLabel" style="font-size:13px; opacity:.8;"></span>

          <button id="clearDefaultBtn" type="button" style="padding:8px 10px; font-size:13px;" hidden>
            Clear default
          </button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <div id="resultCount" style="font-size: 13px; opacity: .8;"></div>

          <!-- List / Map toggle -->
          <div class="view-toggle" aria-label="View mode toggle">
            <button id="listViewBtn" type="button" class="toggle-btn" aria-pressed="true">List</button>
            <button id="mapViewBtn" type="button" class="toggle-btn" aria-pressed="false">Map</button>
          </div>
        </div>
      </div>

      <div style="margin-top:10px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">
        <button id="resetBtn" type="button" style="padding:10px 12px; font-size:14px;">Reset filters</button>
      </div>

      <div style="height:1px; background: rgba(201,204,210,.14); margin: 16px 0;"></div>
    </section>

    <section style="text-align:left;">
      <div
        id="dataStatus"
        style="
          padding: 12px 14px;
          border-radius: 12px;
          background: rgba(15,22,34,.35);
          border: 1px solid rgba(201,204,210,.18);
          font-size: 13px;
          line-height: 1.6;
          opacity: .9;
        "
      >
        Loading clubs…
      </div>
    </section>

    <!-- Map view (hidden until Map toggle) -->
    <section id="mapView" hidden>
      <div id="clubsMap" aria-label="UK clubs map"></div>
      <div id="mapHint" hidden></div>
    </section>

    <section id="cardsSection" style="margin-top: 16px;">
      <div id="cards" style="display:grid; grid-template-columns: 1fr; gap: 12px;"></div>
    </section>

    <section style="margin-top: 18px; text-align:center;">
      <p style="font-size: 14px; opacity: .8; margin: 0;">
        Found something wrong or missing? <a href="/ideas.html">Share a suggestion</a>.
      </p>
    </section>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
  ></script>

  <script>
    // Admin navbar handling (keeps Admin / Exit Admin visible site-wide when session exists)
    document.addEventListener("DOMContentLoaded", () => {
      const ADMIN_SESSION_KEY = "Unipadel_admin_session";
      const isAdminMode = sessionStorage.getItem(ADMIN_SESSION_KEY) === "true";
      const adminNavLink = document.getElementById("adminNavLink");
      const exitAdminLink = document.getElementById("exitAdminLink");

      if (adminNavLink) adminNavLink.hidden = !isAdminMode;
      if (exitAdminLink) exitAdminLink.hidden = !isAdminMode;

      if (exitAdminLink) {
        exitAdminLink.addEventListener("click", (e) => {
          e.preventDefault();
          sessionStorage.removeItem(ADMIN_SESSION_KEY);
          window.location.href = "/ideas.html";
        });
      }
    });

    // Published CSV export
    const PRICING_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScd-zwQsGJvYPwU4f_Avfy5xUhaSrSAZFrO4iVWLbHipkhRym1iRBOcnLqRqCeCQrcP6BTABkPEqxf/pub?single=true&gid=0&output=csv";

    // Default location storage
    const REMEMBER_KEY = "unipadel_remember_location_v2"; // "1" or "0"
    const DEFAULT_KEY  = "unipadel_default_location_v2";  // JSON: {region, county, city, area}

    // View mode (per-device)
    const VIEW_KEY = "unipadel_clubs_view_v1"; // "list" | "map"

    const els = {
      cards: document.getElementById("cards"),
      cardsSection: document.getElementById("cardsSection"),
      status: document.getElementById("dataStatus"),
      search: document.getElementById("searchInput"),
      region: document.getElementById("regionFilter"),
      county: document.getElementById("countyFilter"),
      city: document.getElementById("cityFilter"),
      area: document.getElementById("areaFilter"),
      reset: document.getElementById("resetBtn"),
      count: document.getElementById("resultCount"),

      remember: document.getElementById("rememberToggle"),
      savedLabel: document.getElementById("savedLabel"),
      clearDefault: document.getElementById("clearDefaultBtn"),

      listBtn: document.getElementById("listViewBtn"),
      mapBtn: document.getElementById("mapViewBtn"),
      mapView: document.getElementById("mapView"),
      mapEl: document.getElementById("clubsMap"),
      mapHint: document.getElementById("mapHint"),
    };

    function norm(s) { return String(s || "").trim(); }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeLink(url) {
      const u = norm(url);
      if (!u) return "";
      if (u.startsWith("http://") || u.startsWith("https://")) return u;
      return "";
    }

    function keyify(header) {
      return norm(header).toLowerCase().replace(/\s+/g, "").replace(/[^a-z0-9]/g, "");
    }

    function isTruthyActive(v) {
      const t = norm(v).toLowerCase();
      if (!t) return true; // if column missing/blank, treat as active
      return ["true","1","yes","y"].includes(t);
    }

    async function parseCsvToRows(csvText) {
      const text = csvText.replace(/^\uFEFF/, "");
      const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
      if (!lines.length) return [];

      function splitCsvLine(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (ch === "," && !inQuotes) {
            out.push(cur);
            cur = "";
          } else {
            cur += ch;
          }
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      const rawHeaders = splitCsvLine(lines[0]);
      const headers = rawHeaders.map(h => keyify(h));

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = splitCsvLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => obj[h] = cols[idx] ?? "");
        rows.push(obj);
      }
      return rows;
    }

    function toNum(v) {
      const n = parseFloat(String(v || "").replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }

    function mapRow(r) {
      const get = (k) => norm(r[k] || "");
      return {
        Venue: get("venue"),
        City: get("city"),
        Area: get("area"),
        BookingPlatform: get("bookingplatform"),
        BookingURL: get("bookingurl"),
        PriceRange: get("pricerange"),
        PriceUnit: get("priceunit"),
        SourceURL: get("sourceurl"),
        LastVerified: get("lastverified"),
        Active: get("active"),

        // Optional (for Map mode): add these columns to your CSV when ready
        Latitude: toNum(r["latitude"]),
        Longitude: toNum(r["longitude"]),
      };
    }

    // ----------------------------
    // NORMALISE messy rows (display + filtering)
    // ----------------------------
    function normaliseRow(r) {
      let city = norm(r.City);
      let area = norm(r.Area);

      // Fix swapped Newcastle entries like: City="Gosforth", Area="Newcastle..."
      if (/newcastle/i.test(area) && (city.toLowerCase() === "gosforth")) {
        city = "Newcastle upon Tyne";
        area = "Gosforth";
      }

      // Fix "Urban Green / Blaydon" stored in City with Area="Newcastle upon Tyne"
      if (area === "Newcastle upon Tyne" && city.includes("/")) {
        city = "Newcastle upon Tyne";
        area = norm(r.City); // keep the combined area label
      }

      return { ...r, City: city, Area: area };
    }

    // ----------------------------
    // REGION / COUNTY / CITY mapping
    // (based on UK administrative geography for *your current dataset*)
    // ----------------------------
    const CITY_TO_COUNTY_REGION = [
      // Yorkshire & Humber
      { match: ["Leeds","Wetherby"], county: "West Yorkshire", region: "Yorkshire and the Humber" },

      // North West
      { match: ["Manchester","Salford","Stockport","Cheadle"], county: "Greater Manchester", region: "North West" },
      { match: ["Liverpool","Birkenhead","Bromborough"], county: "Merseyside", region: "North West" },
      { match: ["Ellesmere Port"], county: "Cheshire", region: "North West" },

      // North East
      { match: ["Newcastle upon Tyne","Sunderland","Blaydon"], county: "Tyne and Wear", region: "North East" },
      { match: ["Morpeth","Northumberland"], county: "Northumberland", region: "North East" },

      // London region
      { match: ["London","Romford","Ilford","Barnet"], county: "Greater London", region: "London" },

      // East of England
      { match: ["Watford"], county: "Hertfordshire", region: "East of England" },

      // South East
      { match: ["Weybridge"], county: "Surrey", region: "South East" },
    ];

    function resolveCountyRegion(city) {
      const c = norm(city);
      for (const rule of CITY_TO_COUNTY_REGION) {
        if (rule.match.includes(c)) return { county: rule.county, region: rule.region };
      }
      return { county: "Other", region: "Other" };
    }

    function enrichRow(r0) {
      const r = normaliseRow(r0);
      const { county, region } = resolveCountyRegion(r.City);
      return { ...r, County: county, Region: region };
    }

    function uniqSorted(values) {
      return [...new Set(values.map(norm).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    }

    function setSavedUI() {
      const rememberOn = localStorage.getItem(REMEMBER_KEY) === "1";
      els.remember.checked = rememberOn;

      const savedRaw = localStorage.getItem(DEFAULT_KEY);
      const saved = savedRaw ? (() => { try { return JSON.parse(savedRaw); } catch { return null; } })() : null;

      if (rememberOn && saved && (saved.region || saved.county || saved.city || saved.area)) {
        const bits = [saved.region, saved.county, saved.city, saved.area].filter(Boolean);
        els.savedLabel.textContent = `Default: ${bits.join(" · ")}`;
        els.clearDefault.hidden = false;
      } else if (rememberOn) {
        els.savedLabel.textContent = "Default: (not set yet)";
        els.clearDefault.hidden = true;
      } else {
        els.savedLabel.textContent = "Default: off";
        els.clearDefault.hidden = true;
      }
    }

    function saveDefaultFromCurrent() {
      if (localStorage.getItem(REMEMBER_KEY) !== "1") return;
      const payload = {
        region: norm(els.region.value),
        county: norm(els.county.value),
        city: norm(els.city.value),
        area: norm(els.area.value),
      };
      localStorage.setItem(DEFAULT_KEY, JSON.stringify(payload));
      setSavedUI();
    }

    function clearDefault() {
      localStorage.removeItem(DEFAULT_KEY);
      setSavedUI();
    }

    function fillRegion(rows) {
      const regions = uniqSorted(rows.map(r => r.Region));
      els.region.innerHTML = `<option value="">All regions</option>` + regions.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

    function fillCounty(rows) {
      const region = norm(els.region.value);
      const filtered = rows.filter(r => !region || r.Region === region);
      const counties = uniqSorted(filtered.map(r => r.County));
      els.county.innerHTML = `<option value="">All counties / city-regions</option>` + counties.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

    function fillCity(rows) {
      const region = norm(els.region.value);
      const county = norm(els.county.value);
      const filtered = rows.filter(r =>
        (!region || r.Region === region) &&
        (!county || r.County === county)
      );
      const cities = uniqSorted(filtered.map(r => r.City));
      els.city.innerHTML = `<option value="">All cities</option>` + cities.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

    function fillArea(rows) {
      const region = norm(els.region.value);
      const county = norm(els.county.value);
      const city = norm(els.city.value);

      const filtered = rows.filter(r =>
        (!region || r.Region === region) &&
        (!county || r.County === county) &&
        (!city || r.City === city)
      );

      const areas = uniqSorted(filtered.map(r => r.Area));
      els.area.innerHTML = `<option value="">All areas</option>` + areas.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

    // ----------------------------
    // MAP (Leaflet + MarkerCluster)
    // ----------------------------
    let map = null;
    let clusterLayer = null;
    let lastFilteredForMap = [];

    function setViewMode(mode) {
      const m = (mode === "map") ? "map" : "list";
      localStorage.setItem(VIEW_KEY, m);

      const isMap = m === "map";
      els.mapView.hidden = !isMap;
      els.cardsSection.hidden = isMap;

      els.listBtn.setAttribute("aria-pressed", isMap ? "false" : "true");
      els.mapBtn.setAttribute("aria-pressed", isMap ? "true" : "false");

      if (isMap) {
        ensureMap();
        setTimeout(() => {
          try { map.invalidateSize(); } catch {}
          updateMapMarkers(lastFilteredForMap, { fit: true });
        }, 50);
      }
    }

    function ensureMap() {
      if (map) return;

      map = L.map(els.mapEl, { scrollWheelZoom: true }).setView([54.5, -3.0], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Cluster layer replaces plain markers layer
      clusterLayer = L.markerClusterGroup({
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 15
      });
      map.addLayer(clusterLayer);
    }

    function updateMapMarkers(filteredRows, opts = {}) {
      lastFilteredForMap = filteredRows || [];
      if (!map || !clusterLayer) return;

      clusterLayer.clearLayers();

      const withCoords = (filteredRows || []).filter(r =>
        Number.isFinite(r.Latitude) && Number.isFinite(r.Longitude)
      );

      if (!withCoords.length) {
        els.mapHint.hidden = false;
        els.mapHint.innerHTML = `
          <strong>Map needs coordinates.</strong><br/>
          Make sure your clubs sheet includes <code>Latitude</code> and <code>Longitude</code> values.<br/>
          List view still shows all filtered clubs.
        `;
        map.setView([54.5, -3.0], 6);
        return;
      }

      els.mapHint.hidden = true;
      els.mapHint.textContent = "";

      const bounds = [];

      for (const r of withCoords) {
        const title = r.Venue || "Club";
        const subtitle = [r.Area, r.City].filter(Boolean).join(" · ");
        const bookingUrl = safeLink(r.BookingURL);
        const sourceUrl = safeLink(r.SourceURL);

        const popup = `
          <div style="font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial; font-size: 13px; line-height: 1.5;">
            <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${escapeHtml(title)}</div>
            <div style="opacity:.85; margin-bottom:6px;">${escapeHtml(subtitle)}</div>
            <div style="opacity:.85; margin-bottom:8px;">
              <strong>${escapeHtml(r.PriceRange || "—")}</strong> ${escapeHtml(r.PriceUnit || "")}
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              ${bookingUrl ? `<a href="${escapeHtml(bookingUrl)}" target="_blank" rel="noopener noreferrer">Book</a>` : ""}
              ${sourceUrl ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">Source</a>` : ""}
            </div>
          </div>
        `;

        const marker = L.marker([r.Latitude, r.Longitude]).bindPopup(popup);
        clusterLayer.addLayer(marker);
        bounds.push([r.Latitude, r.Longitude]);
      }

      if (opts.fit) {
        try { map.fitBounds(bounds, { padding: [24, 24] }); } catch {}
      }
    }

    // ----------------------------
    // FILTERING + RENDER
    // ----------------------------
    function applyFilters(rows) {
      const q = norm(els.search.value).toLowerCase();
      const region = norm(els.region.value);
      const county = norm(els.county.value);
      const city = norm(els.city.value);
      const area = norm(els.area.value);

      const filtered = rows.filter(r => {
        if (!isTruthyActive(r.Active)) return false;

        if (region && r.Region !== region) return false;
        if (county && r.County !== county) return false;
        if (city && r.City !== city) return false;
        if (area && r.Area !== area) return false;

        if (q) {
          const hay = `${r.Venue} ${r.Area} ${r.City} ${r.County} ${r.Region} ${r.BookingPlatform} ${r.PriceRange}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }

        return true;
      });

      els.count.textContent = `${filtered.length} club${filtered.length === 1 ? "" : "s"} shown`;

      renderCards(filtered);
      if (map) updateMapMarkers(filtered, { fit: false });
      lastFilteredForMap = filtered;
    }

    function renderCards(rows) {
      els.cards.innerHTML = "";

      if (!rows.length) {
        els.cards.innerHTML = `
          <div style="padding:16px;border-radius:14px;border:1px dashed rgba(201,204,210,.25);text-align:center;opacity:.9;">
            No clubs match your filters.
          </div>
        `;
        return;
      }

      for (const r of rows) {
        const bookingUrl = safeLink(r.BookingURL);
        const sourceUrl  = safeLink(r.SourceURL);

        const card = document.createElement("div");
        card.style.padding = "14px";
        card.style.borderRadius = "14px";
        card.style.border = "1px solid rgba(201,204,210,.18)";
        card.style.background = "rgba(15,22,34,.35)";
        card.style.textAlign = "left";

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">
            <div style="min-width: 240px; flex: 1;">
              <div style="font-weight:700; font-size:16px; line-height:1.35;">${escapeHtml(r.Venue || "Unnamed venue")}</div>
              <div style="margin-top:6px; font-size:13px; opacity:.85;">
                ${escapeHtml([r.Area, r.City].filter(Boolean).join(" · "))}
              </div>
              <div style="margin-top:6px; font-size:12px; opacity:.75;">
                ${escapeHtml([r.County, r.Region].filter(Boolean).join(" · "))}
              </div>
              <div style="margin-top:6px; font-size:12px; opacity:.75;">
                Booking: ${escapeHtml(r.BookingPlatform || "—")}
              </div>
            </div>

            <div style="min-width: 180px; text-align:right;">
              <div style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.65;">Published range</div>
              <div style="margin-top:6px; font-size:20px; font-weight:700; line-height:1.2;">
                ${escapeHtml(r.PriceRange || "—")}
              </div>
              <div style="margin-top:4px; font-size:12px; opacity:.8;">
                ${escapeHtml(r.PriceUnit || "")}
              </div>
            </div>
          </div>

          <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            ${
              bookingUrl
                ? `<a href="${escapeHtml(bookingUrl)}" target="_blank" rel="noopener noreferrer"
                     style="display:inline-block; padding:10px 12px; border-radius:10px; text-decoration:none;
                            background: rgba(182,230,0,.14); border: 1px solid rgba(182,230,0,.30);">
                     Book
                   </a>`
                : ""
            }

            ${
              sourceUrl
                ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer"
                     style="display:inline-block; padding:10px 12px; border-radius:10px; text-decoration:none;
                            background: rgba(47,128,237,.12); border: 1px solid rgba(47,128,237,.30);">
                     Source
                   </a>`
                : ""
            }
          </div>
        `;

        els.cards.appendChild(card);
      }
    }

    async function loadData() {
      try {
        els.status.textContent = "Loading clubs…";
        const res = await fetch(PRICING_CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("CSV HTTP " + res.status);

        const csv = await res.text();
        const rawRows = await parseCsvToRows(csv);
        const mapped = rawRows.map(mapRow);

        const cleaned = mapped
          .filter(r =>
            norm(r.Venue) &&
            norm(r.City) &&
            norm(r.Area) &&
            norm(r.BookingPlatform) &&
            safeLink(r.BookingURL) &&
            norm(r.PriceRange) &&
            norm(r.PriceUnit) &&
            safeLink(r.SourceURL)
          )
          .map(enrichRow);

        if (!cleaned.length) {
          els.status.innerHTML =
            `No rows matched the expected headers/fields.<br/>
             Make sure your header row includes:<br/>
             <code>Venue, City, Area, BookingPlatform, BookingURL, PriceRange, PriceUnit, SourceURL</code>`;
          return [];
        }

        els.status.textContent = "Showing published price ranges — tap “Source” to verify.";
        return cleaned;
      } catch (err) {
        console.error(err);
        els.status.innerHTML =
          `Could not load clubs right now.<br/>
           <span style="opacity:.85;">Reason: ${escapeHtml(String(err.message || err))}</span>`;
        return [];
      }
    }

    (async function init() {
      const rows = await loadData();

      if (!localStorage.getItem(REMEMBER_KEY)) localStorage.setItem(REMEMBER_KEY, "0");
      setSavedUI();

      // Fill cascading dropdowns
      fillRegion(rows);
      fillCounty(rows);
      fillCity(rows);
      fillArea(rows);

      // Apply saved default if remember is ON
      const rememberOn = localStorage.getItem(REMEMBER_KEY) === "1";
      const savedRaw = localStorage.getItem(DEFAULT_KEY);
      const saved = (rememberOn && savedRaw) ? (() => { try { return JSON.parse(savedRaw); } catch { return null; } })() : null;

      if (saved) {
        if (saved.region) els.region.value = saved.region;
        fillCounty(rows);

        if (saved.county) els.county.value = saved.county;
        fillCity(rows);

        if (saved.city) els.city.value = saved.city;
        fillArea(rows);

        if (saved.area) els.area.value = saved.area;
      }

      applyFilters(rows);

      // Restore view mode (default list)
      const savedView = localStorage.getItem(VIEW_KEY) || "list";
      setViewMode(savedView);

      // Toggle events
      els.listBtn.addEventListener("click", () => setViewMode("list"));
      els.mapBtn.addEventListener("click", () => setViewMode("map"));

      // Events (cascade down)
      els.region.addEventListener("change", () => {
        els.county.value = "";
        els.city.value = "";
        els.area.value = "";
        fillCounty(rows);
        fillCity(rows);
        fillArea(rows);
        saveDefaultFromCurrent();
        applyFilters(rows);
      });

      els.county.addEventListener("change", () => {
        els.city.value = "";
        els.area.value = "";
        fillCity(rows);
        fillArea(rows);
        saveDefaultFromCurrent();
        applyFilters(rows);
      });

      els.city.addEventListener("change", () => {
        els.area.value = "";
        fillArea(rows);
        saveDefaultFromCurrent();
        applyFilters(rows);
      });

      els.area.addEventListener("change", () => {
        saveDefaultFromCurrent();
        applyFilters(rows);
      });

      els.search.addEventListener("input", () => applyFilters(rows));

      els.remember.addEventListener("change", () => {
        localStorage.setItem(REMEMBER_KEY, els.remember.checked ? "1" : "0");
        if (!els.remember.checked) {
          localStorage.removeItem(DEFAULT_KEY);
        } else {
          saveDefaultFromCurrent();
        }
        setSavedUI();
      });

      els.clearDefault.addEventListener("click", () => {
        clearDefault();
        els.region.value = "";
        els.county.value = "";
        els.city.value = "";
        els.area.value = "";
        fillCounty(rows);
        fillCity(rows);
        fillArea(rows);
        applyFilters(rows);
      });

      els.reset.addEventListener("click", () => {
        els.search.value = "";
        els.region.value = "";
        els.county.value = "";
        els.city.value = "";
        els.area.value = "";
        if (localStorage.getItem(REMEMBER_KEY) === "1") localStorage.removeItem(DEFAULT_KEY);
        setSavedUI();
        fillCounty(rows);
        fillCity(rows);
        fillArea(rows);
        applyFilters(rows);
      });
    })();
  </script>
</body>
</html>
