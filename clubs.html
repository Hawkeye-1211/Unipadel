<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- MarkerCluster -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <style>
    .view-toggle { display:inline-flex; gap:8px; }
    .toggle-btn {
      border:1px solid rgba(201,204,210,.2);
      background:rgba(15,22,34,.35);
      padding:9px 12px;
      border-radius:10px;
      font-size:13px;
      cursor:pointer;
    }
    .toggle-btn[aria-pressed="true"] {
      border-color:rgba(182,230,0,.4);
      background:rgba(182,230,0,.12);
    }
    #clubsMap {
      width:100%;
      height:420px;
      border-radius:14px;
      border:1px solid rgba(201,204,210,.18);
    }
    @media(max-width:640px){ #clubsMap{height:360px;} }
  </style>
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>
    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>
      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width:860px;">
    <h1 class="brand"><span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span></h1>

    <section style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
      <div id="resultCount" style="font-size:13px;opacity:.8;"></div>
      <div class="view-toggle">
        <button id="listViewBtn" class="toggle-btn" aria-pressed="true">List</button>
        <button id="mapViewBtn" class="toggle-btn" aria-pressed="false">Map</button>
      </div>
    </section>

    <section id="mapView" hidden style="margin-top:12px;">
      <div id="clubsMap"></div>
    </section>

    <section style="margin-top:16px;">
      <div id="cards" style="display:grid;grid-template-columns:1fr;gap:12px;"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const VIEW_KEY="unipadel_clubs_view";
    const els={
      cards:document.getElementById("cards"),
      count:document.getElementById("resultCount"),
      listBtn:document.getElementById("listViewBtn"),
      mapBtn:document.getElementById("mapViewBtn"),
      mapView:document.getElementById("mapView"),
      mapEl:document.getElementById("clubsMap")
    };

    let map, cluster;

    function setView(mode){
      const isMap=mode==="map";
      localStorage.setItem(VIEW_KEY,mode);
      els.mapView.hidden=!isMap;
      els.cards.parentElement.hidden=isMap;
      els.listBtn.setAttribute("aria-pressed",!isMap);
      els.mapBtn.setAttribute("aria-pressed",isMap);
      if(isMap){ initMap(); setTimeout(()=>map.invalidateSize(),50); }
    }

    function initMap(){
      if(map) return;
      map=L.map(els.mapEl).setView([54.5,-3],6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:18,attribution:"© OpenStreetMap"
      }).addTo(map);
      cluster=L.markerClusterGroup({
        showCoverageOnHover:false,
        spiderfyOnMaxZoom:true,
        disableClusteringAtZoom:15
      });
      map.addLayer(cluster);
    }

    function updateMap(rows){
      if(!cluster) return;
      cluster.clearLayers();
      const pts=[];
      rows.forEach(r=>{
        if(!isFinite(r.Latitude)||!isFinite(r.Longitude)) return;
        const m=L.marker([r.Latitude,r.Longitude])
          .bindPopup(`<strong>${r.Venue}</strong><br>${[r.Area,r.City].join(" · ")}`);
        cluster.addLayer(m);
        pts.push([r.Latitude,r.Longitude]);
      });
      if(pts.length) map.fitBounds(pts,{padding:[30,30]});
    }

    els.listBtn.onclick=()=>setView("list");
    els.mapBtn.onclick=()=>setView("map");

    setView(localStorage.getItem(VIEW_KEY)||"list");
  </script>
</body>
</html>
