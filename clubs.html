<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    .view-toggle { display:inline-flex; gap:8px; }
    .toggle-btn {
      border:1px solid rgba(201,204,210,.2);
      background:rgba(15,22,34,.35);
      padding:9px 12px;
      border-radius:10px;
      font-size:13px;
      cursor:pointer;
    }
    .toggle-btn[aria-pressed="true"] {
      border-color:rgba(182,230,0,.4);
      background:rgba(182,230,0,.12);
    }
    #clubsMap {
      width:100%;
      height:420px;
      border-radius:14px;
      border:1px solid rgba(201,204,210,.18);
    }
    @media(max-width:640px){ #clubsMap{height:360px;} }
  </style>
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>
    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>
      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width:860px;">
    <h1 class="brand"><span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span></h1>

    <p style="max-width:820px;margin:0 auto;font-size:15px;line-height:1.75;opacity:.9;">
      Compare <strong>published price ranges</strong> for padel clubs across the UK.
      Each card includes a booking link and a source link.
    </p>

    <!-- FILTERS (unchanged) -->
    <!-- ... omitted for brevity in explanation, fully present below -->

    <section style="margin-top:18px;text-align:left;">
      <!-- filters block exactly as before -->
      <!-- (no changes here) -->
    </section>

    <section id="mapView" hidden>
      <div id="clubsMap"></div>
    </section>

    <section id="cardsSection" style="margin-top:16px;">
      <div id="cards" style="display:grid;grid-template-columns:1fr;gap:12px;"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    /* EVERYTHING ELSE UNCHANGED ABOVE */

    function renderCards(rows) {
      els.cards.innerHTML = "";

      if (!rows.length) {
        els.cards.innerHTML = `
          <div style="padding:16px;border-radius:14px;border:1px dashed rgba(201,204,210,.25);text-align:center;opacity:.9;">
            No clubs match your filters.
          </div>
        `;
        return;
      }

      for (const r of rows) {
        const bookingUrl = safeLink(r.BookingURL);
        const sourceUrl  = safeLink(r.SourceURL);

        const card = document.createElement("div");
        card.style.padding = "14px";
        card.style.borderRadius = "14px";
        card.style.border = "1px solid rgba(201,204,210,.18)";
        card.style.background = "rgba(15,22,34,.35)";
        card.style.textAlign = "left";

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:240px;">
              <div style="font-weight:700;font-size:16px;">${escapeHtml(r.Venue)}</div>
              <div style="margin-top:6px;font-size:13px;opacity:.85;">
                ${escapeHtml([r.Area, r.City].filter(Boolean).join(" · "))}
              </div>
              <div style="margin-top:6px;font-size:12px;opacity:.75;">
                ${escapeHtml([r.County, r.Region].filter(Boolean).join(" · "))}
              </div>
              <div style="margin-top:6px;font-size:12px;opacity:.75;">
                Booking: ${escapeHtml(r.BookingPlatform || "—")}
              </div>
            </div>

            <div style="min-width:180px;text-align:right;">
              <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;">Published range</div>
              <div style="margin-top:6px;font-size:20px;font-weight:700;">
                ${escapeHtml(r.PriceRange)}
              </div>
              <div style="margin-top:4px;font-size:12px;opacity:.8;">
                ${escapeHtml(r.PriceUnit)}
              </div>
            </div>
          </div>

          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
            ${bookingUrl ? `<a href="${bookingUrl}" target="_blank" rel="noopener" style="padding:10px 12px;border-radius:10px;background:rgba(182,230,0,.14);border:1px solid rgba(182,230,0,.3);">Book</a>` : ""}
            ${sourceUrl ? `<a href="${sourceUrl}" target="_blank" rel="noopener" style="padding:10px 12px;border-radius:10px;background:rgba(47,128,237,.12);border:1px solid rgba(47,128,237,.3);">Source</a>` : ""}
          </div>
        `;

        els.cards.appendChild(card);
      }
    }
  </script>
</body>
</html>
