<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPadel — Clubs & Pricing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body data-page="clubs">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/learn.html">Learn</a>
      <a href="/clubs.html">Clubs</a>
      <a href="/ideas.html">Ideas</a>

      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container" style="max-width: 860px;">
    <h1 class="brand">
      <span class="brand-uni">Clubs</span><span class="brand-padel">Pricing</span>
    </h1>

    <p style="max-width: 820px; margin: 0 auto; font-size: 15px; line-height: 1.75; opacity: .9;">
      Compare published padel court price ranges across the UK.
    </p>

    <section style="margin-top: 18px; text-align:left;">
      <div style="font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px;">
        Search & filter
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="searchInput" type="text" placeholder="Search venue / area / city…" style="flex:1; min-width: 220px;" />

        <select id="cityFilter" style="width:auto; min-width: 200px;">
          <option value="">All cities</option>
        </select>

        <select id="areaFilter" style="width:auto; min-width: 220px;">
          <option value="">All areas</option>
        </select>
      </div>

      <div style="margin-top: 10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
        <div id="resultCount" style="font-size: 13px; opacity: .8;"></div>
        <button id="resetBtn" type="button" style="padding:10px 12px; font-size:14px;">
          Reset
        </button>
      </div>

      <div style="height:1px; background: rgba(201,204,210,.14); margin: 16px 0;"></div>
    </section>

    <section>
      <div id="dataStatus" style="font-size:13px; opacity:.85;">Loading clubs…</div>
    </section>

    <section style="margin-top:16px;">
      <div id="cards" style="display:grid; grid-template-columns:1fr; gap:12px;"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "unipadel_default_city";

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScd-zwQsGJvYPwU4f_Avfy5xUhaSrSAZFrO4iVWLbHipkhRym1iRBOcnLqRqCeCQrcP6BTABkPEqxf/pub?single=true&gid=0&output=csv";

    const els = {
      cards: document.getElementById("cards"),
      status: document.getElementById("dataStatus"),
      search: document.getElementById("searchInput"),
      city: document.getElementById("cityFilter"),
      area: document.getElementById("areaFilter"),
      reset: document.getElementById("resetBtn"),
      count: document.getElementById("resultCount"),
    };

    function norm(v) { return String(v || "").trim(); }

    function parseCSV(text) {
      const lines = text.replace(/\r/g, "").split("\n").filter(Boolean);
      const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
      return lines.slice(1).map(l => {
        const cols = l.split(",");
        const o = {};
        headers.forEach((h,i)=>o[h]=cols[i]||"");
        return o;
      });
    }

    function applyFilters(rows) {
      const q = els.search.value.toLowerCase();
      const city = els.city.value;
      const area = els.area.value;

      const filtered = rows.filter(r => {
        if (city && r.city !== city) return false;
        if (area && r.area !== area) return false;
        if (q && !(`${r.venue} ${r.city} ${r.area}`.toLowerCase().includes(q))) return false;
        return true;
      });

      els.count.textContent = `${filtered.length} club${filtered.length!==1?"s":""} shown`;
      renderCards(filtered);
    }

    function renderCards(rows) {
      els.cards.innerHTML = rows.map(r => `
        <div style="padding:14px;border:1px solid rgba(201,204,210,.18);border-radius:14px;">
          <strong>${r.venue}</strong><br/>
          <span style="opacity:.8">${r.area} · ${r.city}</span><br/>
          <span>${r.pricerange} ${r.priceunit}</span>
        </div>
      `).join("");
    }

    fetch(CSV_URL)
      .then(r=>r.text())
      .then(t=>{
        const rows = parseCSV(t);

        const cities = [...new Set(rows.map(r=>r.city))].sort();
        els.city.innerHTML += cities.map(c=>`<option>${c}</option>`).join("");

        const savedCity = localStorage.getItem(STORAGE_KEY);
        if (savedCity && cities.includes(savedCity)) {
          els.city.value = savedCity;
        }

        els.city.addEventListener("change",()=>{
          localStorage.setItem(STORAGE_KEY, els.city.value);
          applyFilters(rows);
        });

        els.search.addEventListener("input",()=>applyFilters(rows));
        els.area.addEventListener("change",()=>applyFilters(rows));

        els.reset.addEventListener("click",()=>{
          localStorage.removeItem(STORAGE_KEY);
          els.city.value="";
          els.area.value="";
          els.search.value="";
          applyFilters(rows);
        });

        applyFilters(rows);
        els.status.textContent="Showing published price ranges";
      });
  </script>
</body>
</html>
