<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UniPadel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body data-page="ideas">
  <nav class="navbar">
    <a href="/" class="logo">UniPadel</a>
    <div class="nav-links">
      <a href="/">About</a>
      <a href="/ideas.html">Ideas</a>
      <a href="/ideas.html?admin=unipadelgold">Admin</a>
    </div>
  </nav>

  <div class="container">
    <img src="Images/UniPadel-logo.png" alt="UniPadel Logo" class="logo" />

    <h1>UniPadel</h1>
    <p>Submit ideas for the future UniPadel site.</p>

    <!-- IDEAS (public) section -->
    <section id="ideasSection">
      <form id="ideaForm">
        <label for="userName">Your name</label><br />
        <input type="text" id="userName" name="userName" required /><br /><br />

        <label for="userEmail">Your email</label><br />
        <input type="email" id="userEmail" name="userEmail" required /><br /><br />

        <label for="ideaTitle">What's your idea</label><br />
        <input type="text" id="ideaTitle" name="ideaTitle" required /><br /><br />

        <label for="ideaDescription">Tell us more</label><br />
        <textarea
          id="ideaDescription"
          name="ideaDescription"
          rows="5"
          required
        ></textarea><br /><br />

        <button type="submit">Serve idea</button>
      </form>

      <p id="messageArea"></p>
    </section>

    <!-- ADMIN section -->
    <section id="adminSection">
      <!-- Keep this button in the HTML so existing app.js logic can still use it,
           but we will auto-trigger it + hide it in admin mode. -->
      <button id="adminToggle" type="button">Admin Mode</button>

      <hr />

      <div class="owner-only">
        <h2>Submitted Ideas</h2>
        <ul id="ideasList"></ul>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
