<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UniPadel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body data-page="ideas">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/ideas.html">Ideas</a>

      <!-- Hidden by default; app.js shows these only during an admin session -->
      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" hidden>Admin</a>
      <a href="/ideas.html" id="exitAdminLink" hidden>Exit Admin</a>
    </div>
  </nav>

  <div class="container">
    <h1>UniPadel</h1>
    <p>Submit ideas for the future UniPadel site.</p>

    <section id="ideasSection">
      <form id="ideaForm">
        <input type="hidden" id="submissionTs" name="_submission_ts" value="" />

        <!-- Spam protection: honeypot (humans won't fill this; bots often do) -->
        <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off" />
        </div>

        <label for="userName">Your name</label><br />
        <input type="text" id="userName" name="userName" required /><br /><br />

        <label for="userEmail">Your email</label><br />
        <input type="email" id="userEmail" name="userEmail" required /><br /><br />

        <label for="ideaTitle">What's your idea</label><br />
        <input type="text" id="ideaTitle" name="ideaTitle" required /><br /><br />

        <label for="ideaDescription">Tell us more</label><br />
        <textarea id="ideaDescription" name="ideaDescription" rows="5" required></textarea><br /><br />

        <button type="submit">Serve idea</button>
      </form>

      <p id="messageArea"></p>
    </section>

    <!-- Admin list (app.js will show/hide this based on mode) -->
    <div class="owner-only">
      <h2>Submitted Ideas</h2>
      <ul id="ideasList"></ul>
    </div>
  </div>

  <!-- IMPORTANT: absolute path + cache-bust -->
  <script src="/app.js?v=20260124-3"></script>
</body>
</html>
