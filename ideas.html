<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UniPadel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body data-page="ideas">
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="/Images/UniPadel-logo.png" alt="UniPadel logo" class="nav-logo" />
    </a>

    <div class="nav-links">
      <a href="/">About</a>
      <a href="/ideas.html">Ideas</a>

      <!-- Hidden by default; app.js shows these only in admin session -->
      <a href="/ideas.html?admin=unipadelgold" id="adminNavLink" style="display:none;">Admin</a>
      <a href="/ideas.html" id="exitAdminLink" style="display:none;">Exit Admin</a>
    </div>
  </nav>

  <div class="container">
    <h1>UniPadel</h1>
    <p>Submit ideas for the future UniPadel site.</p>

    <section id="ideasSection">
      <form id="ideaForm">
        <label for="userName">Your name</label><br />
        <input type="text" id="userName" name="userName" required /><br /><br />

        <label for="userEmail">Your email</label><br />
        <input type="email" id="userEmail" name="userEmail" required /><br /><br />

        <label for="ideaTitle">What's your idea</label><br />
        <input type="text" id="ideaTitle" name="ideaTitle" required /><br /><br />

        <label for="ideaDescription">Tell us more</label><br />
        <textarea id="ideaDescription" name="ideaDescription" rows="5" required></textarea><br /><br />

        <button type="submit">Serve idea</button>
      </form>

      <p id="messageArea"></p>
    </section>

    <section id="adminSection">
      <button id="adminToggle" type="button">Admin Mode</button>

      <hr />

      <div class="owner-only">
        <h2>Submitted Ideas</h2>
        <ul id="ideasList"></ul>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
