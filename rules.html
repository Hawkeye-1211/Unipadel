<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniPadel — Rules</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Page-only styles (do not affect other pages) -->
  <style>
    .rules-wrap { max-width: 980px; margin: 60px auto; padding: 0 16px; }
    .rules-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: start;
    }
    .rules-card {
      border-radius: 12px;
      border: 1px solid rgba(201,204,210,.14);
      background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(0,0,0,.24));
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .rules-card-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(201,204,210,.14);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .rules-card-header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: .2px;
    }
    .rules-card-header p {
      margin: 0;
      opacity: .85;
      font-size: .95rem;
    }

    /* Interactive court */
    .court-wrap { padding: 14px; }
    .court {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 14px;
      border: 1px solid rgba(201,204,210,.18);
      background:
        radial-gradient(700px 300px at 20% 10%, rgba(47,128,237,.18), transparent 60%),
        radial-gradient(700px 300px at 80% 10%, rgba(182,230,0,.10), transparent 60%),
        linear-gradient(180deg, rgba(20,26,34,.95), rgba(11,15,20,.95));
      position: relative;
      overflow: hidden;
    }

    /* Court lines (simple, readable) */
    .court svg { position:absolute; inset: 0; width:100%; height:100%; }
    .court .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      right: 12px;
      font-size: .92rem;
      opacity: .88;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(201,204,210,.16);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
    }

    /* Hotspots */
    .hotspot {
      position: absolute;
      border-radius: 12px;
      border: 1px solid rgba(201,204,210,.18);
      background: rgba(47,128,237,.10);
      cursor: pointer;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      outline: none;
    }
    .hotspot:hover { background: rgba(47,128,237,.18); border-color: rgba(159,208,240,.55); }
    .hotspot:active { transform: scale(.99); }
    .hotspot:focus-visible {
      outline: 2px solid rgba(182,230,0,.65);
      outline-offset: 3px;
    }
    .hotspot[data-active="1"] {
      background: rgba(182,230,0,.12);
      border-color: rgba(182,230,0,.55);
    }

    /* Layout of zones (approximate top-down court) */
    /* Left half */
    .hs-serve-left  { left: 6%;  top: 18%; width: 40%; height: 30%; }
    .hs-kitchen-left{ left: 6%;  top: 50%; width: 40%; height: 18%; }
    .hs-glass-left  { left: 6%;  top: 70%; width: 40%; height: 22%; }

    /* Right half */
    .hs-serve-right  { left: 54%; top: 18%; width: 40%; height: 30%; }
    .hs-kitchen-right{ left: 54%; top: 50%; width: 40%; height: 18%; }
    .hs-glass-right  { left: 54%; top: 70%; width: 40%; height: 22%; }

    /* Center / net */
    .hs-net { left: 47.5%; top: 14%; width: 5%; height: 78%; border-radius: 999px; background: rgba(255,255,255,.05); }

    /* Right-hand panel */
    .panel { padding: 14px 16px; }
    .panel h2 { margin: 8px 0 6px; font-size: 1.05rem; }
    .panel p { margin: 0 0 12px; opacity: .9; line-height: 1.45; }
    .pill-row { display:flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
    .pill {
      border: 1px solid rgba(201,204,210,.18);
      background: rgba(15,22,34,.65);
      padding: 8px 10px;
      border-radius: 999px;
      font-size: .92rem;
      cursor: pointer;
      color: #E5E7EB;
    }
    .pill:hover { border-color: rgba(159,208,240,.55); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 2000;
    }
    .modal {
      max-width: 720px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(201,204,210,.18);
      background: linear-gradient(180deg, rgba(20,26,34,.98), rgba(11,15,20,.98));
      box-shadow: 0 24px 70px rgba(0,0,0,.65);
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(201,204,210,.14);
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .modal-head h3 { margin:0; font-size: 1.05rem; }
    .modal-body { padding: 14px 16px; line-height: 1.5; opacity: .95; }
    .modal-actions { padding: 14px 16px; border-top: 1px solid rgba(201,204,210,.14); display:flex; justify-content:flex-end; }
    .modal-close {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(201,204,210,.18);
      border-radius: 10px;
      padding: 10px 12px;
      color: #E5E7EB;
      cursor: pointer;
    }
    .modal-close:hover { border-color: rgba(159,208,240,.55); }

    @media (max-width: 900px) {
      .rules-grid { grid-template-columns: 1fr; }
      .rules-wrap { margin: 14px auto; }
    }
  </style>
</head>
