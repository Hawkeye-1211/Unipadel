<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<title>UniPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
 <img src="Images/UniPadel-logo.png" alt="Upadel Logo" class="logo" />
  <h1>UniPadel</h1>
  <p>Submit ideas for the future Unipadel site.</p>

  <form id="ideaForm">
    <label for="userName">Your name</label><br />
<input type="text" id="userName" name="userName" required /><br /><br />

<label for="userEmail">Your email</label><br />
<input type="email" id="userEmail" name="userEmail" required /><br /><br />

    <label for="ideaTitle">Whats your idea</label><br />
    <input type="text" id="ideaTitle" name="ideaTitle" required /><br /><br />

    <label for="ideaDescription">Tell us more</label><br />
    <textarea
      id="ideaDescription"
      name="ideaDescription"
      rows="5"
      required
    ></textarea><br /><br />

    <button type="submit">Serve idea</button>
  </form>

  <p id="messageArea"></p>
  <button id="adminToggle" type="button">Admin Mode</button>

</button>

<hr />

<div class="owner-only">
  <h2>Submitted Ideas</h2>
  <ul id="ideasList"></ul>
</div>

  <script src="app.js"></script>
  <div>
</body>
</html>
